name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
  images:
    # Multi-arch images on a version tag, pushed to GHCR as ghcr.io/mytview/ytdl-dash and
    # ghcr.io/mytview/ytdl-dash-agent with the workflow's own GITHUB_TOKEN: no registry secrets. A new package lands
    # under the organisation as private and is set to public once, in the package's settings on GitHub, after the
    # first push.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { cmd: dash, image: ytdl-dash }
          - { cmd: agent, image: ytdl-dash-agent }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/mytview/${{ matrix.image }}:${{ env.VERSION }}
            ghcr.io/mytview/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,scope=${{ matrix.cmd }},mode=max
