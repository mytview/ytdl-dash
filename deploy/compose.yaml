# One ytdl-sub instance with its agent, and the dashboard over it. Copy, rename the instance, repeat the first two
# services per instance (each with its own config folder and agent port), and list every agent in the dashboard's AGENTS.
# Behind gluetun: uncomment the gluetun service, set network_mode on ytdl-sub, and give the agent GLUETUN_API_URL.
name: ytdl-dash
services:
  # gluetun:
  #   image: qmcgaw/gluetun
  #   container_name: ytdlsub-main-vpn
  #   cap_add: [NET_ADMIN]
  #   devices: [/dev/net/tun:/dev/net/tun]
  #   environment:
  #     VPN_SERVICE_PROVIDER: ...
  #     HTTP_CONTROL_SERVER_ADDRESS: ":8000"
  #   volumes:
  #     - ${APPDATA:-./data}/main/vpn:/gluetun      # auth/config.toml holds the control server's API key

  ytdl-sub:
    image: ghcr.io/jmbannon/ytdl-sub:latest
    container_name: ytdlsub-main
    restart: unless-stopped
    # network_mode: service:gluetun
    volumes:
      - ${APPDATA:-./data}/main/ytdl:/config          # config.yaml, subscriptions.yaml and ytdl-sub's working files
      - ./cron.sh:/config/cron:ro                      # the run script the agent's markers come from; Docker Desktop cannot
                                                       # mount a file inside a mounted folder: copy cron.sh to <config>/cron there
      - ${MEDIA:-./media}:/media
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-10 */2 * * *}
      CRON_RUN_ON_START: "true"
      UPDATE_YT_DLP_ON_START: stable
    healthcheck:                                       # a run succeeded in the last 6 h; the agent shows it through the socket
      test: ["CMD-SHELL", "test -n \"$(find /config/.last-success -mmin -360 2>/dev/null)\""]
      interval: 5m
      start_period: 30m

  agent:
    image: ghcr.io/mytview/ytdl-dash-agent:latest
    container_name: ytdlsub-main-agent
    restart: unless-stopped
    depends_on: [ytdl-sub]
    ports:
      - ${AGENT_PORT:-9100}:9100                       # only needed when the dashboard runs on another host
    environment:
      INSTANCE: main
      HOST: ${HOSTNAME:-}                              # a name for the machine, shown on the card
      TOKEN: ${TOKEN:-}                                # same value as the dashboard's; empty = no commands
      YTDL_CONTAINER: ytdlsub-main                     # with the socket below: health, Run now, Stop, ytdl-sub version
      # GLUETUN_API_URL: http://ytdlsub-main-vpn:8000  # makes gluetun the exit provider and enables gluetun-reconnect
      # GLUETUN_API_KEY: ${GLUETUN_API_KEY}
      # TRIGGERS: "Sign in to confirm => gluetun-reconnect; HTTP Error 429 => notify:https://ntfy.sh/your-topic"
      TZ: ${TZ:-UTC}
    volumes:
      - ${APPDATA:-./data}/main/ytdl:/config:ro
      - ${MEDIA:-./media}:/media:ro
      - ${APPDATA:-./data}/main/agent:/data            # the agent's run history
      - /var/run/docker.sock:/var/run/docker.sock:ro   # optional; drop it and the agent only observes

  dashboard:
    image: ghcr.io/mytview/ytdl-dash:latest
    container_name: ytdl-dash
    restart: unless-stopped
    ports:
      - ${DASH_PORT:-8089}:8089
    environment:
      AGENTS: main=http://agent:9100                   # comma-separated; agents on other hosts by address
      TOKEN: ${TOKEN:-}
      POLL: 60s
      TITLE: ytdl-dash
      TZ: ${TZ:-UTC}
