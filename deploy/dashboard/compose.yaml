# The dashboard, in a folder of its own, over every agent listed in AGENTS: the address of the machine each one runs
# on and the agent's port. Each card takes the agent's own INSTANCE name. TOKEN is the agents' token, for the buttons.
name: ytdl-dash
services:
  dashboard:
    image: ghcr.io/mytview/ytdl-dash:latest
    container_name: ytdl-dash
    restart: unless-stopped
    ports:
      - 8089:8089
    environment:
      AGENTS: http://192.0.2.10:9100,http://192.0.2.10:9101   # each agent: its host's address and its port
      TOKEN: pick-a-long-random-one                           # the agents' token; empty = no buttons
      POLL: 60s
      TITLE: ytdl-dash
